repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: debug-statements
      - id: check-docstring-first

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        exclude: ^(tests/|docs/)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, .]
        exclude: ^tests/

  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check

  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        args: [--py38-plus]

  # Dataiku-specific checks
  - repo: local
    hooks:
      - id: dataiku-recipe-check
        name: Dataiku Recipe Validation
        entry: python
        language: system
        files: 'recipes/.*\.py$'
        args: [-c, "
import sys, re;
content = open(sys.argv[1]).read();
if not re.search(r'import dataiku', content):
  print(f'Missing dataiku import in {sys.argv[1]}');
  sys.exit(1);
if not re.search(r'try:', content) or not re.search(r'except:', content):
  print(f'Missing error handling in {sys.argv[1]}');
  sys.exit(1);
print(f'✅ Recipe validation passed: {sys.argv[1]}')
        "]

      - id: no-hardcoded-secrets
        name: Check for hardcoded secrets
        entry: python
        language: system
        files: '\.(py|json|yml|yaml)$'
        args: [-c, "
import sys, re;
content = open(sys.argv[1]).read();
patterns = [r'password\s*=\s*[\'\"]\w+', r'secret\s*=\s*[\'\"]\w+', r'api_key\s*=\s*[\'\"]\w+'];
for pattern in patterns:
  if re.search(pattern, content, re.IGNORECASE) and '# pragma: allowlist secret' not in content:
    print(f'Potential hardcoded secret found in {sys.argv[1]}');
    sys.exit(1);
        "]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false 